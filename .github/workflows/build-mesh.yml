name: Build ARM64 Mesh Binary

on:
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - '.github/workflows/build-mesh.yml'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - name: Install cross-compile tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu musl-tools
          cargo install cargo-zigbuild 2>&/dev/null || true

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build ARM64 binary (musl, static)
        run: |
          rustup target add aarch64-unknown-linux-musl
          cargo build --release --target aarch64-unknown-linux-musl

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: xmrt-mesh-arm64
          path: target/aarch64-unknown-linux-musl/release/xmrt-mesh
          if-no-files-found: warn

      - name: Create release asset
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: arm64-${{ github.run_number }}
          files: target/aarch64-unknown-linux-musl/release/xmrt-mesh
          body: |
            Automated ARM64 build.
            Target: aarch64-unknown-linux-musl (static, runs on Android/Termux)
